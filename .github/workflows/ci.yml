name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Đúng ba lệnh của quy tắc làm việc số 4, không thêm không bớt.
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
