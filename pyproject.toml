[project]
name = "luna-zero"
version = "0.1.0"
description = "Mô hình ngôn ngữ tiếng Việt 110M tham số, train từ số 0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mặc định bỏ qua test `slow` (quét toàn bộ corpus hàng GB). Chạy chúng trước mỗi
# lần train thật bằng: pytest -m slow
addopts = "-q -m 'not slow'"
markers = [
    "slow: test quét toàn bộ corpus, chạy bằng `pytest -m slow`",
]
